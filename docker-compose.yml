# Seraphim - autonomous developer agent.
#
# `docker compose up -d` brings up the whole stack: Postgres, the Rust API
# (the orchestrator brain), the SvelteKit kanban UI, the long-lived agent
# workspace sandbox, and a Tailscale node that exposes the UI over your tailnet.
#
# Secrets and host-specific paths live in `.env` (see `.env.example`).

name: seraphim

services:
  postgres:
    container_name: seraphim-postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Only the `db` network, and only the API joins it: the production database is
    # NOT reachable from the workspace/agent, frontend, or tailscale. This removes
    # the capability the agent abused to migrate production and break the API
    # (issue #396), rather than relying on an instruction alone.
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: seraphim-api
    build:
      context: ./api
      args:
        # The commit/branch this image is built from, stamped in so the running
        # API can detect updates and signal when a rebuild has landed. Set by
        # scripts/start.sh (and the self-updater) from host git.
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Claude OAuth + GitHub tokens are stored in the database (Settings UI),
      # not the environment, so a host .env scanner can't harvest them.
      CLAUDE_MODEL: ${CLAUDE_MODEL}
      ORG_NAME: ${ORG_NAME}
      API_BIND: 0.0.0.0:27182
      # Name of the workspace container the API drives via `docker exec`.
      WORKSPACE_CONTAINER: seraphim-workspace
      # Name of the Tailscale sidecar the API manages (status/up/down/reauth).
      TAILSCALE_CONTAINER: seraphim-tailscale
      RUST_LOG: info,seraphim_api=debug
      # Self-update: the API launches an updater container that bind-mounts these
      # HOST paths to git pull + `docker compose up -d --build`. HOST_REPO_DIR is
      # the host path to this checked-out repo (scripts/start.sh sets it to the
      # repo root; override in .env if needed, e.g. on Windows).
      HOST_REPO_DIR: ${HOST_REPO_DIR:-}
      SSH_HOME: ${SSH_HOME}
      DOCKER_SOCKET: ${DOCKER_SOCKET}
    ports:
      - "${API_PORT}:27182"
    volumes:
      # The API controls the workspace container through the host Docker daemon.
      - ${DOCKER_SOCKET}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    # `seraphim` for the frontend/workspace/tailscale to reach the API, and `db`
    # for the API (the only service that needs it) to reach Postgres (issue #396).
    networks:
      - seraphim
      - db
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:27182/api/v1/ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    container_name: seraphim-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Server-side base URL the SvelteKit proxy uses to reach the API.
      API_ORIGIN: http://api:27182
      PORT: "31415"
    ports:
      - "${FRONTEND_PORT}:31415"
    depends_on:
      - api
    networks:
      - seraphim

  workspace:
    container_name: seraphim-workspace
    build:
      context: ./workspace
    # Tag the built image so the API can recreate the container from it on demand.
    image: seraphim-workspace:latest
    restart: unless-stopped
    environment:
      # Tokens are injected per-exec by the API from the database, not baked in.
      # Writable, persistent config dir for the agent's Claude session/config.
      CLAUDE_CONFIG_DIR: /workspace/.claude
      # Git identity for the agent's commits in every cloned repo (issue #214).
      # The entrypoint writes these system-wide; the fallback keeps a commit from
      # ever failing with "Author identity unknown" when .env omits them.
      GIT_USER_NAME: ${GIT_USER_NAME:-Seraphim}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-seraphim@users.noreply.github.com}
    volumes:
      # Persistent agent home: cloned repos + the single Claude conversation.
      - workspace-data:/workspace
      # Host ~/.ssh, read-only: keys for cloning git@ SSH repos.
      - ${SSH_HOME}:/host-ssh:ro
      # Lets the agent run docker/earthly for the repos it works on.
      - ${DOCKER_SOCKET}:/var/run/docker.sock
    networks:
      - seraphim

  # Lightweight LiteLLM proxy sidecar (issue #342). Groundwork to eventually drive
  # any LiteLLM-supported LLM (OpenAI, xAI Grok, Moonshot Kimi, ...) through one
  # Anthropic-compatible endpoint the Claude Code CLI can be pointed at. It runs in
  # LiteLLM's lightweight mode: no database, no admin UI, no telemetry. Opt-in and
  # NOT wired into the agent yet, so it only starts under the `llm` profile
  # (`docker compose --profile llm up -d`); a default deployment carries no extra
  # container until model routing lands. Reachable in-cluster at http://litellm:4000.
  litellm:
    container_name: seraphim-litellm
    # Pinned; the plain `litellm` image is the DB-free proxy (the `-database`
    # variant is the heavier one). Bump deliberately, per the version-pinning rule.
    image: ghcr.io/berriai/litellm:v1.93.0
    profiles: ["llm"]
    restart: unless-stopped
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      # No DATABASE_URL / STORE_MODEL_IN_DB is set, so the proxy skips the database
      # entirely; the admin UI is disabled too. This is the lightweight deployment.
      DISABLE_ADMIN_UI: "True"
      # Auth for clients hitting the proxy, plus the provider keys the routes use.
      # All from `.env`; an unset provider key just makes that route fail at call
      # time, so the proxy still starts with none configured.
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/etc/litellm/config.yaml:ro
    networks:
      - seraphim
    healthcheck:
      # The image is Python-based (no curl/wget guaranteed); urllib is always here.
      # /health/liveliness needs no auth and returns 200 once the proxy is serving.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  tailscale:
    container_name: seraphim-tailscale
    # Pinned, not `:latest`: a floating tag can silently pull a new
    # tailscale/containerboot that changes behavior between rebuilds. Bump
    # deliberately, per the version-pinning rule (issue #372).
    image: tailscale/tailscale:v1.98.9
    restart: unless-stopped
    # A blank TS_AUTHKEY means "skip Tailscale" (see .env.example), but the stock
    # containerboot entrypoint keeps exiting when it cannot authenticate, and
    # `restart: unless-stopped` then thrashes it in a ~2-minute crash loop
    # (issue #353). Guard the entrypoint: with no auth key, idle cleanly instead
    # of looping; with one, hand off to the normal containerboot. The `$$` defers
    # expansion to container runtime, so the key is read from the environment and
    # never baked into the image's inspectable command.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${TS_AUTHKEY:-}" ]; then
          echo "seraphim: TS_AUTHKEY is blank; Tailscale disabled, idling (set TS_AUTHKEY in .env to enable)." >&2
          exec sleep infinity
        fi
        exec /usr/local/bin/containerboot
    hostname: ${TS_HOSTNAME}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      # Serve config proxies the tailnet HTTPS endpoint to the UI and API.
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      - frontend
      - api
    networks:
      - seraphim

networks:
  seraphim:
    driver: bridge
  # Isolates Postgres so only the API (which joins both networks) can reach it.
  # `internal: true` gives it no gateway, so the database is unreachable from the
  # workspace/agent and has no outbound path either; the API still reaches the
  # internet over `seraphim` (issue #396).
  db:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  workspace-data:
  tailscale-state:
